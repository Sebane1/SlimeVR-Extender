name: Build and Release SlimeVR Extended

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os.name }})
    runs-on: ${{ matrix.os.runner }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - name: windows
            runner: windows-latest
            platform: windows
            electron_arch: x64
            bindings_dir: win-x64
            extender_rid: win-x64
            extender_archive: slimevr-extender-app-windows-x64.zip
            driver_url: https://nightly.link/SlimeVR/SlimeVR-OpenVR-Driver/workflows/c-cpp/sapphire%2Fsolarxr-external-trackers-rewrite/slimevr-openvr-driver-win64.zip
            driver_file: slimevr-openvr-driver-win64.zip

          - name: linux-x64
            runner: ubuntu-latest
            platform: linux
            electron_arch: x64
            bindings_dir: linux-x64
            extender_rid: linux-x64
            extender_archive: slimevr-extender-app-linux-x64.tar.gz
            driver_url: https://nightly.link/SlimeVR/SlimeVR-OpenVR-Driver/workflows/c-cpp/sapphire%2Fsolarxr-external-trackers-rewrite/slimevr-openvr-driver-x64-linux.zip
            driver_file: slimevr-openvr-driver-x64-linux.zip

          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            platform: linux
            electron_arch: arm64
            bindings_dir: linux-arm64
            extender_rid: linux-arm64
            extender_archive: slimevr-extender-app-linux-aarch64.tar.gz
            driver_url: https://nightly.link/SlimeVR/SlimeVR-OpenVR-Driver/workflows/c-cpp/sapphire%2Fsolarxr-external-trackers-rewrite/slimevr-openvr-driver-aarch64-linux.zip
            driver_file: slimevr-openvr-driver-aarch64-linux.zip

          - name: macos
            runner: macos-latest
            platform: macos
            electron_arch: universal
            bindings_dir: ""
            extender_rid: osx-x64
            extender_archive: slimevr-extender-app-macos.zip
            driver_url: ""
            driver_file: ""

    steps:
      - name: Checkout SlimeVR-Server Extended
        uses: actions/checkout@v6
        with:
          repository: Sebane1/SlimeVR-Server
          ref: main-extended
          fetch-depth: 0
          submodules: false

      - name: Checkout SlimeVR-Extender
        uses: actions/checkout@v6
        with:
          path: SlimeVR-Extender-Repo

      - name: Checkout OpenVR Submodule
        if: matrix.os.platform != 'macos'
        shell: bash
        run: |
          set -e

          git submodule sync -- bindings-provider/openvr
          git submodule update \
            --init \
            --force \
            bindings-provider/openvr

          git -C bindings-provider/openvr rev-parse HEAD

      - name: Checkout Custom SolarXR Protocol
        shell: bash
        run: |
          set -e

          rm -rf solarxr-protocol

          git clone \
            --branch main-extended \
            --single-branch \
            --recurse-submodules \
            https://github.com/Sebane1/SolarXR-Protocol.git \
            solarxr-protocol

          git -C solarxr-protocol submodule update --init --recursive

          git -C solarxr-protocol remote -v
          git -C solarxr-protocol branch --show-current
          git -C solarxr-protocol rev-parse HEAD
          git -C solarxr-protocol log -1 --oneline

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - name: Install Linux Dependencies
        if: matrix.os.platform == 'linux'
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            curl \
            wget \
            libssl-dev \
            libgtk-3-dev \
            libnotify-dev \
            libnss3-dev \
            libxss1 \
            libxtst6 \
            libatspi2.0-0 \
            libdrm2 \
            libgbm1 \
            rpm

      - name: Install GCC 16
        if: matrix.os.platform == 'linux'
        uses: egor-tensin/setup-gcc@v2
        with:
          version: 16

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build SolarXR FlatBuffers Compiler
        shell: bash
        run: |
          set -e

          cmake \
            -S solarxr-protocol/lib/flatbuffers \
            -B solarxr-protocol/lib/flatbuffers/build-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DFLATBUFFERS_BUILD_TESTS=OFF \
            -DFLATBUFFERS_BUILD_FLATLIB=OFF \
            -DFLATBUFFERS_BUILD_SHAREDLIB=OFF \
            -DFLATBUFFERS_BUILD_GRPCTEST=OFF

          cmake \
            --build solarxr-protocol/lib/flatbuffers/build-ci \
            --config Release \
            --target flatc \
            -j 4

          FLATC=""

          if [ -f "solarxr-protocol/lib/flatbuffers/build-ci/flatc" ]; then
            FLATC="$(pwd)/solarxr-protocol/lib/flatbuffers/build-ci/flatc"
          elif [ -f "solarxr-protocol/lib/flatbuffers/build-ci/Release/flatc.exe" ]; then
            FLATC="$(pwd)/solarxr-protocol/lib/flatbuffers/build-ci/Release/flatc.exe"
          elif [ -f "solarxr-protocol/lib/flatbuffers/build-ci/flatc.exe" ]; then
            FLATC="$(pwd)/solarxr-protocol/lib/flatbuffers/build-ci/flatc.exe"
          fi

          if [ -z "$FLATC" ]; then
            echo "ERROR: flatc was not produced."
            find solarxr-protocol/lib/flatbuffers/build-ci -iname "flatc*" -print
            exit 1
          fi

          FLATC_DIR="$(dirname "$FLATC")"

          echo "$FLATC_DIR" >> "$GITHUB_PATH"

          echo "Using flatc:"
          echo "$FLATC"

          "$FLATC" --version

      - name: Regenerate SolarXR Protocol
        shell: bash
        run: |
          set -e

          echo "flatc on PATH:"
          command -v flatc || true

          flatc --version

          cd solarxr-protocol

          chmod +x ./generate-flatbuffer.sh
          ./generate-flatbuffer.sh

          cd ..

      - name: Inspect Generated SolarXR Header
        shell: bash
        run: |
          set -e

          HEADER="solarxr-protocol/protocol/cpp/include/solarxr_protocol/generated/all_generated.h"

          echo "SolarXR commit:"
          git -C solarxr-protocol rev-parse HEAD

          echo ""
          echo "Generated header:"
          ls -lh "$HEADER"

          echo ""
          echo "Checking for merge markers..."

          if grep -nE '^(<<<<<<<|=======|>>>>>>>)' "$HEADER"; then
            echo ""
            echo "ERROR: Generated SolarXR C++ header contains conflict markers."
            exit 1
          fi

          echo "No conflict markers found."

          echo ""
          echo "Relevant generated header section:"
          sed -n '700,950p' "$HEADER"

      - name: Configure Bindings Provider
        if: matrix.os.platform != 'macos'
        shell: bash
        run: |
          set -e

          cmake \
            -S bindings-provider \
            -B "bindings-provider/build/${{ matrix.os.bindings_dir }}" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Bindings Provider
        if: matrix.os.platform != 'macos'
        shell: bash
        run: |
          set -e

          cmake \
            --build "bindings-provider/build/${{ matrix.os.bindings_dir }}" \
            --config Release \
            -j 6

      - name: Build Desktop Server JAR
        shell: bash
        run: |
          set -e

          chmod +x ./gradlew || true

          ./gradlew \
            :server:desktop:shadowJar \
            --build-cache

      - name: Verify Desktop Server JAR
        shell: bash
        run: |
          set -e

          ls -lah server/desktop/build/libs/
          test -f server/desktop/build/libs/slimevr.jar

      - name: Build GUI
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm run build

      - name: Download OpenVR Driver
        if: matrix.os.driver_url != ''
        shell: bash
        run: |
          set -e

          mkdir -p driver

          curl \
            --fail \
            --location \
            --retry 3 \
            --output "driver/${{ matrix.os.driver_file }}" \
            "${{ matrix.os.driver_url }}"

      - name: Determine Version
        id: version
        shell: bash
        run: |
          VERSION=$(git --no-pager tag \
            --sort=-taggerdate \
            --points-at HEAD | head -1)

          if [ -z "$VERSION" ]; then
            VERSION="0.0.0"
          fi

          VERSION="${VERSION#v}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare Electron Artifact Directories
        shell: bash
        run: |
          mkdir -p \
            gui/electron/dist/artifacts/linux \
            gui/electron/dist/artifacts/win \
            gui/electron/dist/artifacts/mac

      - name: Package Electron - Windows
        if: matrix.os.platform == 'windows'
        shell: bash
        working-directory: gui/electron
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -e

          pnpm exec electron-builder \
            --win \
            --x64 \
            --config.extraMetadata.version="${{ steps.version.outputs.version }}" \
            --publish never

      - name: Package Electron - Linux
        if: matrix.os.platform == 'linux'
        shell: bash
        working-directory: gui/electron
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -e

          pnpm exec electron-builder \
            --linux \
            --${{ matrix.os.electron_arch }} \
            --config.extraMetadata.version="${{ steps.version.outputs.version }}" \
            --publish never

      - name: Package Electron - macOS
        if: matrix.os.platform == 'macos'
        shell: bash
        working-directory: gui/electron
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -e

          pnpm exec electron-builder \
            --mac \
            --universal \
            --config.extraMetadata.version="${{ steps.version.outputs.version }}" \
            --publish never

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build SlimeVR Extender
        shell: bash
        run: |
          set -e

          PROJ_PATH="SlimeVR-Extender-Repo/SlimeVR-Extender/SlimeVR-Extender.csproj"

          mkdir -p extender-dist

          dotnet publish \
            "$PROJ_PATH" \
            -c Release \
            -r "${{ matrix.os.extender_rid }}" \
            --self-contained true \
            -o "extender-dist/${{ matrix.os.extender_rid }}"

      - name: Package Extender - Windows
        if: matrix.os.platform == 'windows'
        shell: pwsh
        run: |
          $source = "extender-dist/${{ matrix.os.extender_rid }}/*"
          $destination = "${{ matrix.os.extender_archive }}"

          Compress-Archive `
            -Path $source `
            -DestinationPath $destination `
            -Force

      - name: Package Extender - Linux
        if: matrix.os.platform == 'linux'
        shell: bash
        run: |
          set -e

          tar \
            -czvf "${{ matrix.os.extender_archive }}" \
            -C "extender-dist/${{ matrix.os.extender_rid }}" \
            .

      - name: Package Extender - macOS
        if: matrix.os.platform == 'macos'
        shell: bash
        run: |
          set -e

          cd "extender-dist/${{ matrix.os.extender_rid }}"

          zip \
            -r \
            "../../${{ matrix.os.extender_archive }}" \
            .

      - name: Assemble Windows Release
        if: matrix.os.platform == 'windows'
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "release-package" | Out-Null

          Get-ChildItem "gui/electron/dist/artifacts/win" -File | ForEach-Object {
            Copy-Item $_.FullName "release-package/"
          }

          Copy-Item `
            "server/desktop/build/libs/slimevr.jar" `
            "release-package/slimevr.jar"

          $driver = "driver/${{ matrix.os.driver_file }}"

          if (Test-Path $driver) {
            Copy-Item $driver "release-package/"
          }

          Compress-Archive `
            -Path "release-package/*" `
            -DestinationPath "slimevr-server-windows.zip" `
            -Force

      - name: Assemble Linux Release
        if: matrix.os.platform == 'linux'
        shell: bash
        run: |
          set -e

          mkdir -p release-package

          find gui/electron/dist/artifacts/linux \
            -maxdepth 1 \
            -type f \
            -exec cp {} release-package/ \;

          cp \
            server/desktop/build/libs/slimevr.jar \
            release-package/slimevr.jar

          if [ -f "driver/${{ matrix.os.driver_file }}" ]; then
            cp \
              "driver/${{ matrix.os.driver_file }}" \
              release-package/
          fi

          tar \
            -czvf "slimevr-server-${{ matrix.os.name }}.tar.gz" \
            -C release-package \
            .

      - name: Assemble macOS Release
        if: matrix.os.platform == 'macos'
        shell: bash
        run: |
          set -e

          mkdir -p release-package

          find gui/electron/dist/artifacts/mac \
            -maxdepth 1 \
            -type f \
            -exec cp {} release-package/ \;

          cp \
            server/desktop/build/libs/slimevr.jar \
            release-package/slimevr.jar

          cd release-package
          zip -r ../slimevr-server-macos.zip .
          cd ..

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v7
        with:
          name: slimevr-server-${{ matrix.os.name }}
          if-no-files-found: error
          path: |
            slimevr-server-*.zip
            slimevr-server-*.tar.gz
            slimevr-extender-app-*.zip
            slimevr-extender-app-*.tar.gz

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SlimeVR-Server Extended
        uses: actions/checkout@v6
        with:
          repository: Sebane1/SlimeVR-Server
          ref: main-extended
          fetch-depth: 0
          submodules: false

      - name: Checkout Custom SolarXR Protocol
        shell: bash
        run: |
          set -e

          rm -rf solarxr-protocol

          git clone \
            --branch main-extended \
            --single-branch \
            --recurse-submodules \
            https://github.com/Sebane1/SolarXR-Protocol.git \
            solarxr-protocol

          git -C solarxr-protocol submodule update --init --recursive

          git -C solarxr-protocol remote -v
          git -C solarxr-protocol branch --show-current
          git -C solarxr-protocol rev-parse HEAD
          git -C solarxr-protocol log -1 --oneline

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build SolarXR FlatBuffers Compiler
        shell: bash
        run: |
          set -e

          cmake \
            -S solarxr-protocol/lib/flatbuffers \
            -B solarxr-protocol/lib/flatbuffers/build-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DFLATBUFFERS_BUILD_TESTS=OFF \
            -DFLATBUFFERS_BUILD_FLATLIB=OFF \
            -DFLATBUFFERS_BUILD_SHAREDLIB=OFF \
            -DFLATBUFFERS_BUILD_GRPCTEST=OFF

          cmake \
            --build solarxr-protocol/lib/flatbuffers/build-ci \
            --config Release \
            --target flatc \
            -j 4

          FLATC=""

          if [ -f "solarxr-protocol/lib/flatbuffers/build-ci/flatc" ]; then
            FLATC="$(pwd)/solarxr-protocol/lib/flatbuffers/build-ci/flatc"
          elif [ -f "solarxr-protocol/lib/flatbuffers/build-ci/Release/flatc.exe" ]; then
            FLATC="$(pwd)/solarxr-protocol/lib/flatbuffers/build-ci/Release/flatc.exe"
          elif [ -f "solarxr-protocol/lib/flatbuffers/build-ci/flatc.exe" ]; then
            FLATC="$(pwd)/solarxr-protocol/lib/flatbuffers/build-ci/flatc.exe"
          fi

          if [ -z "$FLATC" ]; then
            echo "ERROR: flatc was not produced."
            find solarxr-protocol/lib/flatbuffers/build-ci -iname "flatc*" -print
            exit 1
          fi

          FLATC_DIR="$(dirname "$FLATC")"

          echo "$FLATC_DIR" >> "$GITHUB_PATH"

          echo "Using flatc:"
          echo "$FLATC"

          "$FLATC" --version

      - name: Regenerate SolarXR Protocol
        shell: bash
        run: |
          set -e

          flatc --version

          cd solarxr-protocol

          chmod +x ./generate-flatbuffer.sh
          ./generate-flatbuffer.sh

          cd ..

      - name: Inspect Generated SolarXR Header
        shell: bash
        run: |
          set -e

          HEADER="solarxr-protocol/protocol/cpp/include/solarxr_protocol/generated/all_generated.h"

          if grep -nE '^(<<<<<<<|=======|>>>>>>>)' "$HEADER"; then
            echo "ERROR: Generated SolarXR C++ header contains conflict markers."
            exit 1
          fi

          echo "Generated SolarXR header is clean."

      - name: Build GUI
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm run build

      - name: Build Android APK
        shell: bash
        env:
          ANDROID_STORE_FILE: ${{ secrets.ANDROID_STORE_FILE }}
          ANDROID_STORE_PASSWD: ${{ secrets.ANDROID_STORE_PASSWD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWD: ${{ secrets.ANDROID_KEY_PASSWD }}
        run: |
          set -e

          chmod +x ./gradlew || true

          ./gradlew \
            :server:android:build \
            --build-cache

      - name: Locate Android APK
        shell: bash
        run: |
          set -e

          find \
            server/android/build/outputs \
            -type f \
            -name "*.apk" \
            -print

      - name: Package Android APK
        shell: bash
        run: |
          set -e

          mkdir -p dist
          APK_COUNT=0

          while IFS= read -r apk; do
            cp "$apk" dist/
            APK_COUNT=$((APK_COUNT + 1))
          done < <(
            find \
              server/android/build/outputs/apk \
              -type f \
              -name "*.apk"
          )

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK files were generated."
            exit 1
          fi

          cd dist
          zip -r ../slimevr-server-android.zip .
          cd ..

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v7
        with:
          name: slimevr-server-android
          if-no-files-found: error
          path: slimevr-server-android.zip

  release:
    name: Create GitHub Release

    needs:
      - build-desktop
      - build-android

    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      github.ref_name == 'master' ||
      github.ref_name == 'main' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Display Downloaded Artifacts
        shell: bash
        run: |
          find artifacts -type f -print

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: SlimeVR Extended Build - ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*/*
