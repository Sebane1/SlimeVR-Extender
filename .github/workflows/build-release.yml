name: Build and Release SlimeVR Extended

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os.name }})
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: windows
            runner: windows-latest
            driver_url: https://nightly.link/SlimeVR/SlimeVR-OpenVR-Driver/workflows/c-cpp/sapphire%2Fsolarxr-external-trackers-rewrite/slimevr-openvr-driver-win64.zip
            driver_file: slimevr-openvr-driver-win64.zip
          - name: linux-x64
            runner: ubuntu-latest
            driver_url: https://nightly.link/SlimeVR/SlimeVR-OpenVR-Driver/workflows/c-cpp/sapphire%2Fsolarxr-external-trackers-rewrite/slimevr-openvr-driver-x64-linux.zip
            driver_file: slimevr-openvr-driver-x64-linux.zip
          - name: linux-aarch64
            runner: ubuntu-latest
            driver_url: https://nightly.link/SlimeVR/SlimeVR-OpenVR-Driver/workflows/c-cpp/sapphire%2Fsolarxr-external-trackers-rewrite/slimevr-openvr-driver-aarch64-linux.zip
            driver_file: slimevr-openvr-driver-aarch64-linux.zip
          - name: macos
            runner: macos-latest
            driver_url: ""
            driver_file: ""

    steps:
      - name: Checkout SlimeVR-Server (Extended)
        uses: actions/checkout@v4
        with:
          repository: Sebane1/SlimeVR-Server
          ref: main-extended
          fetch-depth: 0

      - name: Checkout SlimeVR-Extender Repo
        uses: actions/checkout@v4
        with:
          path: SlimeVR-Extender-Repo

      - name: Checkout Sebane1 SolarXR-Protocol Submodule
        shell: bash
        run: |
          git config submodule.solarxr-protocol.url https://github.com/Sebane1/SolarXR-Protocol.git || true
          git submodule update --init --recursive || {
            echo "Submodule checkout failed, cloning Sebane1/SolarXR-Protocol directly..."
            rm -rf solarxr-protocol
            git clone https://github.com/Sebane1/SolarXR-Protocol.git solarxr-protocol
          }
          mkdir -p solarxr-protocol/kotlin-codegen solarxr-protocol/protocol/kotlin solarxr-protocol/rpc/codegen solarxr-protocol/rpc/kotlin
          find solarxr-protocol -name "build.gradle.kts" -exec sed -i.bak 's/kotlinOptions\.jvmTarget/\/\/ kotlinOptions\.jvmTarget/g' {} + || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Node.js & PNPM
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: startsWith(matrix.os.name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential curl wget libssl-dev libayatana-appindicator3-dev

      - name: Build Shadow JAR
        run: |
          chmod +x ./gradlew || true
          ./gradlew shadowJar -x :server:android

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Download Platform OpenVR Driver
        if: matrix.os.driver_url != ''
        shell: bash
        run: |
          mkdir -p driver
          curl -L -o driver/${{ matrix.os.driver_file }} "${{ matrix.os.driver_url }}"

      - name: Build Tauri GUI
        run: pnpm run tauri build

      - name: Package Desktop Artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os.name }}" = "windows" ]; then
            cp target/release/bundle/nsis/*.exe dist/SlimeVR-Server-Setup-${{ matrix.os.name }}.exe || true
            cp target/release/slimevr-gui.exe dist/ || true
            cp server/build/libs/slimevr.jar dist/ || true
            if [ -f driver/slimevr-openvr-driver-win64.zip ]; then
              cp driver/slimevr-openvr-driver-win64.zip dist/
            fi
            cd dist && zip -r ../slimevr-server-${{ matrix.os.name }}.zip ./* && cd ..
          elif [[ "${{ matrix.os.name }}" == linux* ]]; then
            cp target/release/bundle/appimage/*.AppImage dist/SlimeVR-Server-${{ matrix.os.name }}.AppImage || true
            cp server/build/libs/slimevr.jar dist/ || true
            if [ -n "${{ matrix.os.driver_file }}" ] && [ -f "driver/${{ matrix.os.driver_file }}" ]; then
              cp driver/${{ matrix.os.driver_file }} dist/
            fi
            cd dist && tar -czvf ../slimevr-server-${{ matrix.os.name }}.tar.gz ./* && cd ..
          elif [ "${{ matrix.os.name }}" = "macos" ]; then
            cp target/release/bundle/dmg/*.dmg dist/SlimeVR-Server-macOS.dmg || true
            cp server/build/libs/slimevr.jar dist/ || true
            cd dist && zip -r ../slimevr-server-macos.zip ./* && cd ..
          fi

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build & Publish SlimeVR-Extender App
        shell: bash
        run: |
          mkdir -p extender-dist
          PROJ_PATH="SlimeVR-Extender-Repo/SlimeVR-Extender/SlimeVR-Extender.csproj"
          if [ "${{ matrix.os.name }}" = "windows" ]; then
            dotnet publish "$PROJ_PATH" -c Release -r win-x64 -o extender-dist/win-x64
            cd extender-dist/win-x64 && zip -r ../../slimevr-extender-app-windows-x64.zip ./* && cd ../..
          elif [[ "${{ matrix.os.name }}" == linux* ]]; then
            dotnet publish "$PROJ_PATH" -c Release -r linux-x64 -o extender-dist/linux-x64
            cd extender-dist/linux-x64 && tar -czvf ../../slimevr-extender-app-linux-x64.tar.gz ./* && cd ../..
          elif [ "${{ matrix.os.name }}" = "macos" ]; then
            dotnet publish "$PROJ_PATH" -c Release -r osx-x64 -o extender-dist/osx-x64
            cd extender-dist/osx-x64 && zip -r ../../slimevr-extender-app-macos.zip ./* && cd ../..
          fi

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slimevr-server-${{ matrix.os.name }}
          path: |
            slimevr-server-*.zip
            slimevr-server-*.tar.gz
            slimevr-server-*.AppImage
            slimevr-server-*.dmg
            slimevr-extender-app-*.zip
            slimevr-extender-app-*.tar.gz

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SlimeVR-Server (Extended)
        uses: actions/checkout@v4
        with:
          repository: Sebane1/SlimeVR-Server
          ref: main-extended
          fetch-depth: 0

      - name: Checkout Sebane1 SolarXR-Protocol Submodule
        shell: bash
        run: |
          git config submodule.solarxr-protocol.url https://github.com/Sebane1/SolarXR-Protocol.git || true
          git submodule update --init --recursive || {
            echo "Submodule checkout failed, cloning Sebane1/SolarXR-Protocol directly..."
            rm -rf solarxr-protocol
            git clone https://github.com/Sebane1/SolarXR-Protocol.git solarxr-protocol
          }
          mkdir -p solarxr-protocol/kotlin-codegen solarxr-protocol/protocol/kotlin solarxr-protocol/rpc/codegen solarxr-protocol/rpc/kotlin
          find solarxr-protocol -name "build.gradle.kts" -exec sed -i 's/kotlinOptions\.jvmTarget/\/\/ kotlinOptions\.jvmTarget/g' {} + || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Node.js & PNPM
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Build Android APK
        run: |
          pnpm install
          chmod +x ./gradlew || true
          ./gradlew :server:android:assembleRelease || ./gradlew :server:android:assembleDebug || ./gradlew assembleDebug -x :server:desktop

      - name: Locate & Package APK
        run: |
          mkdir -p dist
          find . -name "*.apk" -exec cp {} dist/ \;
          cd dist && zip -r ../slimevr-server-android.zip ./*

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slimevr-server-android
          path: slimevr-server-android.zip

  release:
    name: Create GitHub Release
    needs: [build-desktop, build-android]
    if: startsWith(github.ref, 'refs/tags/') || github.ref_name == 'master' || github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display Downloaded Artifacts
        run: ls -R artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: SlimeVR Extended Build - ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*/*
