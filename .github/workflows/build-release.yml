yaml
name: Build and Release SlimeVR Extended

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os.name }})
    runs-on: ${{ matrix.os.runner }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - name: windows
            runner: windows-latest
            platform: windows
            driver_url: https://nightly.link/SlimeVR/SlimeVR-OpenVR-Driver/workflows/c-cpp/sapphire%2Fsolarxr-external-trackers-rewrite/slimevr-openvr-driver-win64.zip
            driver_file: slimevr-openvr-driver-win64.zip

          - name: linux-x64
            runner: ubuntu-latest
            platform: linux
            driver_url: https://nightly.link/SlimeVR/SlimeVR-OpenVR-Driver/workflows/c-cpp/sapphire%2Fsolarxr-external-trackers-rewrite/slimevr-openvr-driver-x64-linux.zip
            driver_file: slimevr-openvr-driver-x64-linux.zip

          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            platform: linux
            driver_url: https://nightly.link/SlimeVR/SlimeVR-OpenVR-Driver/workflows/c-cpp/sapphire%2Fsolarxr-external-trackers-rewrite/slimevr-openvr-driver-aarch64-linux.zip
            driver_file: slimevr-openvr-driver-aarch64-linux.zip

          - name: macos
            runner: macos-latest
            platform: macos
            driver_url: ""
            driver_file: ""

    steps:
      - name: Checkout SlimeVR-Server Extended
        uses: actions/checkout@v6
        with:
          repository: Sebane1/SlimeVR-Server
          ref: main-extended
          fetch-depth: 0
          submodules: recursive

      - name: Checkout SlimeVR-Extender Repo
        uses: actions/checkout@v6
        with:
          path: SlimeVR-Extender-Repo

      - name: Checkout Sebane1 SolarXR-Protocol Submodule
        shell: bash
        run: |
          git config submodule.solarxr-protocol.url https://github.com/Sebane1/SolarXR-Protocol.git || true

          git submodule update --init --recursive || {
            echo "Submodule checkout failed, cloning Sebane1/SolarXR-Protocol directly..."
            rm -rf solarxr-protocol
            git clone https://github.com/Sebane1/SolarXR-Protocol.git solarxr-protocol
          }

          mkdir -p \
            solarxr-protocol/kotlin-codegen \
            solarxr-protocol/protocol/kotlin \
            solarxr-protocol/rpc/codegen \
            solarxr-protocol/rpc/kotlin

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - name: Install Linux Dependencies
        if: startsWith(matrix.os.name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            libssl-dev \
            libgtk-3-dev \
            libnotify-dev \
            libnss3-dev \
            libxss1 \
            libxtst6 \
            xdg-utils \
            libatspi2.0-0 \
            libdrm2 \
            libgbm1

      # ------------------------------------------------------------
      # Build server JAR
      # ------------------------------------------------------------

      - name: Build Desktop Server JAR
        shell: bash
        run: |
          chmod +x ./gradlew || true
          ./gradlew :server:desktop:shadowJar --build-cache

      - name: Verify Desktop Server JAR
        shell: bash
        run: |
          echo "Desktop JAR contents:"
          ls -lah server/desktop/build/libs/

          test -f server/desktop/build/libs/slimevr.jar

      # ------------------------------------------------------------
      # Build GUI
      # ------------------------------------------------------------

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build GUI Frontend
        run: pnpm run build

      # ------------------------------------------------------------
      # Download OpenVR driver
      # ------------------------------------------------------------

      - name: Download Platform OpenVR Driver
        if: matrix.os.driver_url != ''
        shell: bash
        run: |
          mkdir -p driver
          curl -L \
            -o "driver/${{ matrix.os.driver_file }}" \
            "${{ matrix.os.driver_url }}"

      # ------------------------------------------------------------
      # Package Electron desktop application
      # ------------------------------------------------------------

      - name: Package Electron Application
        shell: bash
        run: |
          mkdir -p \
            gui/electron/dist/artifacts/linux \
            gui/electron/dist/artifacts/win \
            gui/electron/dist/artifacts/mac

          VERSION=$(git --no-pager tag --sort=-taggerdate --points-at HEAD | head -1)

          if [ -z "$VERSION" ]; then
            VERSION="0.0.0"
          fi

          VERSION="${VERSION#v}"

          echo "Building Electron package version: $VERSION"

          cd gui/electron

          if [ "${{ matrix.os.platform }}" = "windows" ]; then
            pnpm exec electron-builder \
              --win \
              --config.extraMetadata.version="$VERSION" \
              --publish never

          elif [ "${{ matrix.os.platform }}" = "linux" ]; then
            pnpm exec electron-builder \
              --linux \
              --config.extraMetadata.version="$VERSION" \
              --publish never

          elif [ "${{ matrix.os.platform }}" = "macos" ]; then
            pnpm exec electron-builder \
              --mac \
              --universal \
              --config.extraMetadata.version="$VERSION" \
              --publish never
          fi

      # ------------------------------------------------------------
      # Package SlimeVR server artifacts
      # ------------------------------------------------------------

      - name: Package Desktop Artifacts
        shell: bash
        run: |
          mkdir -p dist

          cp server/desktop/build/libs/slimevr.jar dist/slimevr.jar

          echo "Searching generated Electron artifacts..."

          find gui/electron/dist -maxdepth 5 -type f -print || true

          if [ "${{ matrix.os.name }}" = "windows" ]; then

            find gui/electron/dist/artifacts/win \
              -type f \
              \( -name "*.exe" -o -name "*.zip" \) \
              -exec cp {} dist/ \; || true

            if [ -f driver/slimevr-openvr-driver-win64.zip ]; then
              cp driver/slimevr-openvr-driver-win64.zip dist/
            fi

            cd dist
            zip -r "../slimevr-server-${{ matrix.os.name }}.zip" ./*
            cd ..

          elif [[ "${{ matrix.os.name }}" == linux* ]]; then

            find gui/electron/dist/artifacts/linux \
              -type f \
              \( -name "*.AppImage" -o -name "*.deb" -o -name "*.tar.gz" -o -name "*.zip" \) \
              -exec cp {} dist/ \; || true

            if [ -n "${{ matrix.os.driver_file }}" ] && \
               [ -f "driver/${{ matrix.os.driver_file }}" ]; then
              cp "driver/${{ matrix.os.driver_file }}" dist/
            fi

            tar -czvf \
              "slimevr-server-${{ matrix.os.name }}.tar.gz" \
              -C dist .

          elif [ "${{ matrix.os.name }}" = "macos" ]; then

            find gui/electron/dist/artifacts/mac \
              -type f \
              \( -name "*.dmg" -o -name "*.zip" \) \
              -exec cp {} dist/ \; || true

            cd dist
            zip -r ../slimevr-server-macos.zip ./*
            cd ..
          fi

      # ------------------------------------------------------------
      # Build SlimeVR Extender
      # ------------------------------------------------------------

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and Publish SlimeVR-Extender App
        shell: bash
        run: |
          mkdir -p extender-dist

          PROJ_PATH="SlimeVR-Extender-Repo/SlimeVR-Extender/SlimeVR-Extender.csproj"

          if [ "${{ matrix.os.name }}" = "windows" ]; then

            dotnet publish "$PROJ_PATH" \
              -c Release \
              -r win-x64 \
              --self-contained true \
              -o extender-dist/win-x64

            cd extender-dist/win-x64
            zip -r ../../slimevr-extender-app-windows-x64.zip ./*
            cd ../..

          elif [ "${{ matrix.os.name }}" = "linux-x64" ]; then

            dotnet publish "$PROJ_PATH" \
              -c Release \
              -r linux-x64 \
              --self-contained true \
              -o extender-dist/linux-x64

            tar -czvf \
              slimevr-extender-app-linux-x64.tar.gz \
              -C extender-dist/linux-x64 .

          elif [ "${{ matrix.os.name }}" = "linux-aarch64" ]; then

            dotnet publish "$PROJ_PATH" \
              -c Release \
              -r linux-arm64 \
              --self-contained true \
              -o extender-dist/linux-arm64

            tar -czvf \
              slimevr-extender-app-linux-aarch64.tar.gz \
              -C extender-dist/linux-arm64 .

          elif [ "${{ matrix.os.name }}" = "macos" ]; then

            dotnet publish "$PROJ_PATH" \
              -c Release \
              -r osx-x64 \
              --self-contained true \
              -o extender-dist/osx-x64

            cd extender-dist/osx-x64
            zip -r ../../slimevr-extender-app-macos.zip ./*
            cd ../..
          fi

      # ------------------------------------------------------------
      # Upload desktop build
      # ------------------------------------------------------------

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v7
        with:
          name: slimevr-server-${{ matrix.os.name }}
          if-no-files-found: error
          path: |
            slimevr-server-*.zip
            slimevr-server-*.tar.gz
            slimevr-extender-app-*.zip
            slimevr-extender-app-*.tar.gz

  # =================================================================
  # Android
  # =================================================================

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SlimeVR-Server Extended
        uses: actions/checkout@v6
        with:
          repository: Sebane1/SlimeVR-Server
          ref: main-extended
          fetch-depth: 0
          submodules: recursive

      - name: Checkout Sebane1 SolarXR-Protocol Submodule
        shell: bash
        run: |
          git config submodule.solarxr-protocol.url https://github.com/Sebane1/SolarXR-Protocol.git || true

          git submodule update --init --recursive || {
            echo "Submodule checkout failed, cloning Sebane1/SolarXR-Protocol directly..."
            rm -rf solarxr-protocol
            git clone https://github.com/Sebane1/SolarXR-Protocol.git solarxr-protocol
          }

          mkdir -p \
            solarxr-protocol/kotlin-codegen \
            solarxr-protocol/protocol/kotlin \
            solarxr-protocol/rpc/codegen \
            solarxr-protocol/rpc/kotlin

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm

      # Android expects the built GUI assets.
      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build GUI Frontend
        run: pnpm run build

      - name: Build Android APK
        shell: bash
        run: |
          chmod +x ./gradlew || true
          ./gradlew :server:android:build --build-cache

      - name: Locate Android APK
        shell: bash
        run: |
          echo "Generated APKs:"
          find server/android/build/outputs -type f -name "*.apk" -print

      - name: Package Android APK
        shell: bash
        run: |
          mkdir -p dist

          find server/android/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -exec cp {} dist/ \;

          if ! find dist -type f -name "*.apk" | grep -q .; then
            echo "No APK files were produced."
            exit 1
          fi

          cd dist
          zip -r ../slimevr-server-android.zip ./*
          cd ..

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v7
        with:
          name: slimevr-server-android
          if-no-files-found: error
          path: slimevr-server-android.zip

  # =================================================================
  # Release
  # =================================================================

  release:
    name: Create GitHub Release
    needs:
      - build-desktop
      - build-android

    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      github.ref_name == 'master' ||
      github.ref_name == 'main' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Display Downloaded Artifacts
        shell: bash
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -print

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: SlimeVR Extended Build - ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*/*
